[package]
name = "bump-version"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
